<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vernal — You're offline</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f1eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #2a2318;
      }

      .card {
        background: #fdfcf9;
        border-radius: 12px;
        padding: 2.5rem 2rem;
        max-width: 360px;
        width: calc(100% - 2rem);
        text-align: center;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 1.5rem;
        font-size: 1rem;
        line-height: 1.5;
        color: #2a2318;
        opacity: 0.8;
      }

      button {
        background: #4a6b40;
        color: #f5f1eb;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Reconnect to continue planning your garden.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
